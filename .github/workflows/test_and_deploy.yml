# Runs the test matrix with uv (locked) and publishes on tagged releases.
name: tests

on:
  push:
    branches:
      - main
      - npe2
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - npe2
  workflow_dispatch:   # lets you trigger the full matrix on your fork before opening a PR

jobs:
  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false   # don't cancel macOS when Windows fails — you want all results
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        # Matches requires-python = ">=3.8". 3.8/3.9 are EOL; recommend dropping to
        # ['3.10', '3.11', '3.12'] and bumping requires-python to match.
        python-version: ['3.8', '3.9', '3.10']

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # setuptools_scm needs full history + tags to compute the version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # system Qt libs so PyQt5 can run under a virtual display on Linux
      - uses: tlambert03/setup-qt-libs@v1

      # OpenGL for Qt on Windows (strategy borrowed from vispy)
      - name: Install Windows OpenGL
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 https://github.com/pyvista/gl-ci-helpers.git
          powershell gl-ci-helpers/appveyor/install_opengl.ps1

      # --locked fails the build if uv.lock is stale vs pyproject.toml.
      # Run `uv lock` and commit the result if this step complains.
      - name: Install dependencies (locked)
        run: uv sync --locked --extra testing

      # headless-gui provides the virtual display (xvfb on Linux) that pytest-qt needs
      - name: Run tests
        uses: aganders3/headless-gui@v2
        with:
          run: uv run --no-sync pytest -v --color=yes --cov=precision_recall_analysis_tool --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}   # optional for public repos under v5; remove this block if you don't use Codecov

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags drive the setuptools_scm version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.x"

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish